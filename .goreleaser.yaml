version: 2

project_name: projecto

before:
  hooks:
    # Generate shell completion scripts once, ahead of all builds, so they
    # can be bundled into archives and installed by the AUR package.
    - mkdir -p .buildcache/completions
    - sh -c 'go run . completion bash > .buildcache/completions/projecto.bash'
    - sh -c 'go run . completion zsh > .buildcache/completions/_projecto'
    - sh -c 'go run . completion fish > .buildcache/completions/projecto.fish'
    - sh -c 'go run . completion pwsh > .buildcache/completions/_projecto.ps1'

builds:
  - env:
      - CGO_ENABLED=0
    # main.go declares `version`; release builds override it here.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin



archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      # Bundle the generated completions as a completions/ folder in the archive.
      - src: .buildcache/completions/*
        dst: completions
        strip_parent: true

nfpms:
  - package_name: ignit
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/rubiin/ignit
    description: Quickly generate .gitignore files for your projects from a curated list of environment templates.
    license: GPL-3.0-only
    maintainer: rubiin <roobin.bhandari@gmail.com>
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/ignit/LICENSE

changelog:
  sort: desc
  use: git

  groups:
    - title: 🚀 New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?(fix|bug)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999


aurs:
  - name: projecto-bin
    homepage: https://github.com/rubiin/projecto
    description: Launch your project folders directly in your editor of choice from a single command.
    license: GPL-3.0-only
    maintainers:
      - "rubiin <roobin.bhandari@gmail.com>"
    git_url: ssh://aur@aur.archlinux.org/projecto-bin.git
    private_key: "{{ .Env.AUR_KEY }}"
    provides:
      - projecto
    conflicts:
      - projecto
      - projecto-git
    package: |-
      # bin
      install -Dm755 "./projecto" "${pkgdir}/usr/bin/projecto"
      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/projecto/LICENSE"
      # shell completions
      install -Dm644 "./completions/projecto.bash" "${pkgdir}/usr/share/bash-completion/completions/projecto"
      install -Dm644 "./completions/_projecto" "${pkgdir}/usr/share/zsh/site-functions/_projecto"
      install -Dm644 "./completions/projecto.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/projecto.fish"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
